openapi: 3.1.0
info:
  title: 个金营销 NL2SQL v1.5 API
  version: 1.5.0
  description: Vue工作台与Spring Boot模块化单体之间的接口契约。所有业务数据均为模拟数据。
servers:
  - url: http://127.0.0.1:8080
paths:
  /actuator/health:
    get:
      summary: 服务健康状态
      security: []
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
  /api/v1/auth/login:
    post:
      summary: 使用 RSA 加密密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 4, maxLength: 64, pattern: '^[a-z]+[0-9]+$' }
                password: { $ref: "#/components/schemas/EncryptedPassword" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "401": { description: 用户名或密码错误 }
        "403": { description: 账号待审批，暂不可登录 }
  /api/v1/auth/public-key:
    get:
      summary: 获取浏览器密码加密公钥
      description: 返回 RSA-OAEP-256 的 SPKI Base64 公钥和轮换标识；绝不返回私钥。
      security: []
      responses:
        "200":
          description: 公钥获取成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/auth/register:
    post:
      summary: 提交待审批注册申请
      description: 只接收姓名、用户名和 RSA 加密密码。不允许传入角色、区域、网点或客户经理范围。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationRequest" }
      responses:
        "200":
          description: 已创建待审批账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "400": { description: 用户名、姓名、密码或加密信封不符合规则 }
        "409": { description: 用户名已存在 }
  /api/v1/auth/me:
    get:
      summary: 获取当前登录用户和数据范围
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/queries:
    post:
      summary: 提交自然语言查询任务
      description: 同用户同键同内容复用任务；更换内容须用新键。每个会话同时只允许一个未结束任务。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQuery"
      responses:
        "200":
          description: 已创建查询任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "400": { description: 请求或幂等键格式错误 }
        "409": { description: 409005同键不同内容，409006会话已有活动任务 }
  /api/v1/queries/{taskId}/events:
    get:
      summary: SSE真实阶段、结果与错误，支持持久化续传
      description: 事件名status，data为完整TaskStatus，id为event_id。无新事件且已等待或结束时发送无id的snapshot。心跳约10.5秒，连接最长55秒。断开不会取消SQL。
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: Last-Event-ID
          in: header
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        "200":
          description: 直接返回SSE，不使用ApiResponse封装
          content:
            text/event-stream:
              schema: { type: string }
        "404": { description: 任务不存在或不属于当前用户 }
  /api/v1/conversations:
    get:
      summary: 本人持久化会话列表
      parameters:
        - { name: page_no, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: data为本人会话数组，无total，按created_at及session_id倒序，切换账号/读取/反馈不会改变顺序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ConversationSummary" } }
  /api/v1/conversations/{sessionId}:
    delete:
      summary: 删除本人会话；未结束任务会先级联取消，后台审计保留
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        "200":
          description: 已删除或此前已删除；禁止重新访问会话、任务、SSE、提交重放和旧历史
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          session_id: { type: string }
                          deleted: { type: boolean, const: true }
        "404": { description: 不存在或他人会话 }
        "409": { description: 仅在活动任务并发状态变化导致无法安全取消时返回 }
    get:
      summary: 本人会话、上下文及最近消息
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
        - { name: before_message_id, in: query, schema: { type: integer, format: int64, default: 0 }, description: 以此消息的created_at及message_id作为复合游标读取更早消息；非正数取最新页 }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: 本页消息按created_at、message_id升序；before游标对应同会话消息的时间与编号，has_more表示满页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ConversationDetail" }
        "404": { description: 会话不存在或不属于当前用户 }
  /api/v1/conversations/{sessionId}/messages/{messageId}/feedback:
    post:
      summary: 评价本人会话中的助手回复，点赞/点踩互斥且可取消
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
        - { name: messageId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback: { type: string, enum: [LIKE, DISLIKE, NONE] }
      responses:
        "200":
          description: 已保存；data为message_id和feedback，不改变会话顺序/消息时间，不调用模型
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message_id: { type: integer, format: int64 }
                          feedback: { type: string, enum: [LIKE, DISLIKE, NONE] }
        "400": { description: 反馈类型无效 }
        "404": { description: 他人/已删除会话、消息不存在或不是助手回复 }
        "409": { description: 409008，回复尚未完成 }
  /api/v1/conversations/{sessionId}/customer-search:
    get:
      summary: 在当前客户澄清的固定条件内附加筛选
      description: 原问句中的姓名、姓氏、客户编号或手机号后四位由服务端从活动任务读取，客户端不可覆盖。keyword为空时返回固定条件内全部客户；没有固定条件时必须输入keyword。
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
        - { name: keyword, in: query, schema: { type: string, maxLength: 20, default: "" }, description: 仅作为允许字段内的附加筛选 }
        - { name: page_no, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
      responses:
        "200":
          description: 脱敏客户列表；固定条件不在响应中重复展示
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CustomerSearchPage" }
        "400": { description: 附加筛选格式无效，或使用了原问句已占用的字段 }
        "404": { description: 会话不存在或不属于当前用户 }
        "409": { description: 当前没有等待客户定位的活动任务 }
  /api/v1/conversations/{sessionId}/anchors:
    get:
      summary: 获取本人会话用户输入目录，用于快速跳转
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
        - { name: after_message_id, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: data为用户消息编号、内容与created_at数组，按created_at和message_id升序；满页可继续，不包含助手结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            message_id: { type: integer, format: int64 }
                            content: { type: string }
                          created_at: { type: string }
        "404": { description: 不存在、已删除或他人会话 }
  /api/v1/queries/{taskId}/status:
    get:
      summary: 获取任务阶段、反问、确认信息或最终结果
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务状态；根据阶段返回question、confirmation或result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TaskStatus" }
        "404": { description: 任务不存在或不属于当前用户 }
  /api/v1/conversations/{sessionId}/messages:
    post:
      summary: 补充缺失条件或澄清矛盾
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, question_id]
              properties:
                task_id: { type: string, format: uuid }
                question_id: { type: string, format: uuid }
                answer_text: { type: string }
                identity_type: { type: string, enum: [CUSTOMER_ID, CUSTOMER_NAME, MOBILE_SUFFIX], description: 客户身份补充必填，候选选择不需要；与answer_text分开解释 }
                selected_options: { type: array, items: { type: string } }
      responses:
        "200": { description: 已重新进入解析流程 }
  /api/v1/queries/{taskId}/confirmations:
    post:
      summary: 确认或拒绝高范围查询
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_token, decision]
              properties:
                confirm_token: { type: string }
                decision: { type: string, enum: [CONFIRM, REJECT] }
                reason: { type: string }
      responses:
        "200": { description: 确认结果 }
  /api/v1/queries/{taskId}/cancel:
    post:
      summary: 取消本人尚未结束的任务；重复取消或已终态时返回实际状态
      description: 无请求体。取消后不继续修复或模板降级；执行中的JDBC Statement将被取消。完成与取消竞争时以先提交的终态为准。
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 当前任务状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TaskStatus" }
        "404": { description: 任务不存在或不属于当前用户 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    EncryptedPassword:
      type: object
      required: [key_id, encrypted_password]
      properties:
        key_id: { type: string, maxLength: 64, description: 服务端公开 RSA 密钥的轮换标识 }
        encrypted_password: { type: string, maxLength: 8192, description: RSA-OAEP-256 密文的 Base64 编码 }
    RegistrationRequest:
      type: object
      required: [display_name, username, password]
      properties:
        display_name: { type: string, minLength: 2, maxLength: 64 }
        username: { type: string, minLength: 4, maxLength: 64, pattern: '^[a-z]+[0-9]+$' }
        password: { $ref: "#/components/schemas/EncryptedPassword" }
    ApiResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: 处理成功 }
        data: {}
        request_id: { type: string }
    SubmitQuery:
      type: object
      required: [session_id, query_text]
      properties:
        session_id: { type: string, minLength: 1, maxLength: 36, description: 建议使用UUID }
        query_text: { type: string, minLength: 1, maxLength: 1000 }
        thinking_enabled: { type: boolean, default: true, description: 本任务固定设置，澄清和SQL修复沿用；规则路径不调用模型 }
        preferred_display:
          type: string
          description: 非AUTO时优先采用请求展示形式；否则使用模型建议及实际数据适配，非法数据形态不会强行绘图。
          example: AUTO
        page_no: { type: integer, minimum: 1, default: 1, description: 与page_size配套；不能和limit/offset同时传入 }
        page_size: { type: integer, minimum: 1, maximum: 500, default: 100 }
        limit: { type: integer, minimum: 1, maximum: 500, description: 与offset配套；不能和page_no/page_size同时传入 }
        offset: { type: integer, format: int64, minimum: 0, maximum: 100000, default: 0 }
    TaskStatus:
      type: object
      required: [task_id, session_id, status, progress, message, clarification_round, repair_attempts, repairs, execution_timeout_seconds, cancellable, state_version, thinking_enabled]
      properties:
        created_at: { type: string, description: 任务创建时间 }
        updated_at: { type: string, description: 最近阶段更新时间 }
        legacy_recovered: { type: boolean, description: 仅旧回答恢复快照出现 }
        legacy_notice: { type: string, description: 历史结果恢复或缺失说明 }
        task_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        status:
          type: string
          enum: [RECEIVED, INTENT_ANALYZING, ASKING, SQL_GENERATING, VALIDATING, CONFIRMING, EXECUTING, RESULT_REVIEWING, REPAIRING, FALLING_BACK, PACKAGING, SUCCESS, FAILED, CANCELLED, TIMED_OUT, DEGRADED]
        progress: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string }
        intent: { type: [string, "null"] }
        clarification_round: { type: integer, minimum: 0 }
        repair_attempts: { type: integer, minimum: 0, maximum: 2, description: 已消耗的SQL修复调用次数，不含首次规划的响应重试 }
        repairs:
          type: array
          maxItems: 2
          description: 按修复次数升序返回的安全修复轨迹；不包含模型思考或查询结果值
          items: { $ref: "#/components/schemas/SqlRepairTrace" }
        execution_timeout_seconds: { type: integer, minimum: 1, default: 60 }
        cancellable: { type: boolean }
        state_version: { type: integer, format: int64, minimum: 0 }
        thinking_enabled: { type: boolean }
        display_query: { type: string, description: 脱敏的当前有效问题，可能包含已选客户编号 }
        resolved_customer:
          allOf:
            - $ref: "#/components/schemas/CustomerCandidate"
          description: 明确条件唯一命中后的只读脱敏客户卡片；存在时查询已自动继续，不要求再次确认
        question: { $ref: "#/components/schemas/ClarificationQuestion" }
        confirmation: { $ref: "#/components/schemas/Confirmation" }
        result: { $ref: "#/components/schemas/QueryResult" }
        error:
          type: [object, "null"]
          properties:
            message: { type: string }
    SqlRepairTrace:
      type: object
      required: [repair_id, attempt_no, trigger_phase, status, original_sql, failure_reason, repair_reason, created_at, updated_at]
      properties:
        repair_id: { type: integer, format: int64 }
        attempt_no: { type: integer, minimum: 1, maximum: 2 }
        trigger_phase: { type: string, enum: [VALIDATION, EXECUTION, RESULT_REVIEW] }
        status: { type: string, enum: [STARTED, GENERATED, APPLIED, REJECTED, MODEL_FAILED] }
        original_sql: { type: string, description: 本次修复前的完整只读SQL }
        failure_reason: { type: string, description: 已脱敏、截断的失败或拒绝原因 }
        repair_reason: { type: string, description: 触发修复的受控原因 }
        repaired_sql: { type: [string, "null"], description: 模型返回的完整候选SQL；未生成时为空 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ClarificationQuestion:
      type: [object, "null"]
      properties:
        question_id: { type: string, format: uuid }
        type: { type: string, enum: [MISSING_TOPIC, MISSING_TIME_RANGE, TIME_BASIS, CONFLICT, DISPLAY_CONFLICT, MODEL_CLARIFICATION, CUSTOMER_IDENTITY, CUSTOMER_SELECTION, CUSTOMER_NOT_FOUND, CUSTOMER_CONFIRM, CUSTOMER_SCOPE, FOLLOWUP_CONTEXT] }
        prompt: { type: string }
        options: { type: array, items: { type: string } }
        recognized_slots: { type: object, additionalProperties: { type: string } }
        candidates: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/CustomerCandidate" } }
        input_types: { type: array, items: { type: string, enum: [CUSTOMER_ID, CUSTOMER_NAME, MOBILE_SUFFIX] }, description: 身份补充允许的输入类型；普通澄清和候选选择为空 }
        recommended_option: { type: [string, "null"] }
        multi_select: { type: boolean, default: false }
    CustomerCandidate:
      type: object
      required: [customer_id, name, branch_id, mobile]
      properties:
        customer_id: { type: string }
        name: { type: string, description: 脱敏姓名 }
        branch_id: { type: string }
        mobile: { type: string, description: 虚构脱敏手机号 }
    CustomerSearchPage:
      type: object
      required: [total, page_no, page_size, items]
      properties:
        total: { type: integer, minimum: 0 }
        page_no: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 20 }
        items: { type: array, items: { $ref: "#/components/schemas/CustomerCandidate" } }
    ConversationSummary:
      type: object
      required: [session_id, title, state_version]
      properties:
        session_id: { type: string, maxLength: 36 }
        title: { type: string, maxLength: 160 }
        active_task_id: { type: [string, "null"] }
        state_version: { type: integer, format: int64 }
        created_at: { type: string }
        updated_at: { type: string }
    ConversationContext:
      type: [object, "null"]
      properties:
        query: { type: string }
        customer_id: { type: [string, "null"] }
        source_task_id: { type: [string, "null"] }
    ConversationMessage:
      type: object
      required: [message_id, task_id, role_code, content]
      properties:
        message_id: { type: integer, format: int64 }
        task_id: { type: string }
        role_code: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        payload:
          anyOf:
            - $ref: "#/components/schemas/TaskStatus"
            - $ref: "#/components/schemas/LegacyTaskSnapshot"
            - { type: "null" }
        created_at: { type: string }
        updated_at: { type: string, description: 回复最后生成时间，不随反馈变化 }
        feedback: { type: [string, "null"], enum: [LIKE, DISLIKE, NONE, null] }
    LegacyTaskSnapshot:
      type: object
      description: V8从旧任务保存内容恢复的只读快照；不保证旧版本存在所有新TaskStatus/QueryResult字段，不重跑SQL。
      required: [task_id, session_id, status, legacy_recovered, legacy_notice]
      properties:
        task_id: { type: string }
        session_id: { type: string }
        status: { type: string }
        legacy_recovered: { const: true }
        legacy_notice: { type: string }
        cancellable: { const: false }
        result: { type: [object, "null"], additionalProperties: true, description: 原样保存的旧版结果，前端仅补空展示容器 }
      additionalProperties: true
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          required: [messages, has_more]
          properties:
            context: { $ref: "#/components/schemas/ConversationContext" }
            messages: { type: array, items: { $ref: "#/components/schemas/ConversationMessage" } }
            has_more: { type: boolean }
    Confirmation:
      type: [object, "null"]
      properties:
        confirm_token: { type: string }
        risk_level: { type: string, enum: [MEDIUM, HIGH] }
        message: { type: string }
        reasons: { type: array, items: { type: string } }
    QueryResult:
      type: [object, "null"]
      properties:
        result_type: { type: string, example: AUTO }
        title: { type: string }
        summary: { type: string }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ColumnMeta" }
        rows:
          type: array
          items: { type: object, additionalProperties: true }
        total: { type: integer, format: int64, minimum: 0, description: 应用分页前的结果总条数 }
        page_no: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 500 }
        offset: { type: integer, format: int64, minimum: 0 }
        has_more: { type: boolean, description: 当前页后是否仍有结果 }
        metrics:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: {}
              key: { type: string }
              unit: { type: string }
              aggregation: { type: string }
              note: { type: string, description: 指标的实际聚合口径 }
        charts:
          type: array
          items: { $ref: "#/components/schemas/ChartSpec" }
        analysis: { $ref: "#/components/schemas/AnalysisSummary" }
        sql_preview: { type: string, readOnly: true }
        data_as_of: { type: string, format: date }
        interpretation_source: { type: string, enum: [RULE, DEEPSEEK, TEMPLATE_FALLBACK, FALLBACK] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        fallback: { $ref: "#/components/schemas/FallbackInfo" }
    FallbackInfo:
      type: [object, "null"]
      properties:
        reason: { type: string }
        template_id: { type: [string, "null"] }
        data_available: { type: boolean, description: 是否成功执行了模板；true时也可能是正常空结果 }
        suggestions: { type: array, items: { type: string } }
    ColumnMeta:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        data_type: { type: string, enum: [TEXT, NUMBER, DATE] }
        sensitive: { type: boolean }
        role: { type: string, enum: [DIMENSION, TIME, MEASURE] }
        unit: { type: string }
        aggregation: { type: string, enum: [SUM, AVERAGE, WEIGHTED_AVERAGE, NONE] }
        weight_key: { type: [string, "null"] }
    ChartSpec:
      type: object
      properties:
        type: { type: string, enum: [BAR, LINE, AREA, PIE, SCATTER, HEATMAP] }
        title: { type: string }
        dimension_key: { type: string }
        dimension_label: { type: string }
        secondary_dimension_key: { type: [string, "null"], description: 热力图第二维度或时间折线的分类系列键 }
        reason: { type: string }
        series:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              unit: { type: string }
    AnalysisSummary:
      type: object
      properties:
        overview: { type: string }
        insights: { type: array, items: { type: string } }
        suggestions: { type: array, items: { type: string } }
security:
  - bearerAuth: []
