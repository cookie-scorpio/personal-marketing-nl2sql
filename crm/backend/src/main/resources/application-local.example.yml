spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/pf_nl2sql?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Hong_Kong&useSSL=false
    username: nl2sql_app
    password: nl2_sql_dev_password

app:
  security:
    jwt-secret: 请替换为至少32字节的随机字符串
    # 留空时自动生成只在当前后端进程有效的开发密钥。
    password-rsa-private-key: ${AUTH_RSA_PRIVATE_KEY:}
    allow-ephemeral-password-rsa-key: true
  model:
    # 当前默认使用Qwen3-32B；演示纯规则查询可用mock，或改回deepseek。
    provider: qwen
    qwen:
      # 阿里云DashScope的OpenAI兼容模式；自建服务改地址并把thinking-param改为对应值。
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # DashScope必须在阿里云百炼控制台申请API Key（sk-开头）。
      api-key: "请填写DashScope API密钥"
      model: qwen3-32b
      # 短JSON规划建议关闭思考，防止思考耗尽输出额度而无最终content。
      thinking-enabled: false
      # DashScope兼容模式用enable_thinking；vLLM/SGLang用chat_template_kwargs；Ollama用think。
      thinking-param: enable_thinking
      tools-enabled: true
      max-tool-rounds: 3
      result-review-enabled: true
      max-tokens: 16384
      retry-max-tokens: 32768
      read-timeout-seconds: 120
    deepseek:
      # 演示自由提问时将provider改为deepseek并填写密钥；固定高频问题仍优先走规则。
      base-url: https://api.deepseek.com
      api-key: "请填写DeepSeek API密钥"
      model: deepseek-v4-flash
      thinking-enabled: true
      tools-enabled: true
      max-tool-rounds: 3
      result-review-enabled: true
      max-tokens: 16384
      retry-max-tokens: 32768
      read-timeout-seconds: 120
  rag:
    enabled: false
    embedding-model: BCG-E3
    embedding-base-url: ""
    milvus-uri: ""
    collection: nl2sql_business_knowledge
