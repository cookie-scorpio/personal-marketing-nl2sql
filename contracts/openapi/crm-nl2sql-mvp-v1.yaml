openapi: 3.1.0
info:
  title: 个金营销 NL2SQL v1.2 API
  version: 1.2.0
  description: Vue工作台与Spring Boot模块化单体之间的接口契约。所有业务数据均为模拟数据。
servers:
  - url: http://127.0.0.1:8080
paths:
  /actuator/health:
    get:
      summary: 服务健康状态
      security: []
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
  /api/v1/auth/login:
    post:
      summary: 本地数据库账号登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "401": { description: 用户名或密码错误 }
  /api/v1/auth/me:
    get:
      summary: 获取当前登录用户和数据范围
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
  /api/v1/queries:
    post:
      summary: 提交自然语言查询任务
      description: 同用户同键同内容复用任务；更换内容须用新键。每个会话同时只允许一个未结束任务。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]{8,128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitQuery"
      responses:
        "200":
          description: 已创建查询任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResponse" }
        "400": { description: 请求或幂等键格式错误 }
        "409": { description: 409005同键不同内容，409006会话已有活动任务 }
  /api/v1/queries/{taskId}/events:
    get:
      summary: SSE真实阶段、结果与错误，支持持久化续传
      description: 事件名status，data为完整TaskStatus，id为event_id。无新事件且已等待或结束时发送无id的snapshot。心跳约10.5秒，连接最长55秒。断开不会取消SQL。
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - name: Last-Event-ID
          in: header
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        "200":
          description: 直接返回SSE，不使用ApiResponse封装
          content:
            text/event-stream:
              schema: { type: string }
        "404": { description: 任务不存在或不属于当前用户 }
  /api/v1/conversations:
    get:
      summary: 本人持久化会话列表
      parameters:
        - { name: page_no, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200":
          description: data为会话数组，无total，按更新时间倒序
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ConversationSummary" } }
  /api/v1/conversations/{sessionId}:
    get:
      summary: 本人会话、上下文及最近消息
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, maxLength: 36 } }
        - { name: before_message_id, in: query, schema: { type: integer, format: int64, default: 0 }, description: 小于此编号的更早消息，非正数取最新一页 }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: 本页消息按编号升序，has_more表示本页达到数量上限
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ConversationDetail" }
        "404": { description: 会话不存在或不属于当前用户 }
  /api/v1/queries/{taskId}/status:
    get:
      summary: 获取任务阶段、反问、确认信息或最终结果
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务状态；根据阶段返回question、confirmation或result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TaskStatus" }
        "404": { description: 任务不存在或不属于当前用户 }
  /api/v1/conversations/{sessionId}/messages:
    post:
      summary: 补充缺失条件或澄清矛盾
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, question_id]
              properties:
                task_id: { type: string, format: uuid }
                question_id: { type: string, format: uuid }
                answer_text: { type: string }
                selected_options: { type: array, items: { type: string } }
      responses:
        "200": { description: 已重新进入解析流程 }
  /api/v1/queries/{taskId}/confirmations:
    post:
      summary: 确认或拒绝高范围查询
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_token, decision]
              properties:
                confirm_token: { type: string }
                decision: { type: string, enum: [CONFIRM, REJECT] }
                reason: { type: string }
      responses:
        "200": { description: 确认结果 }
  /api/v1/queries/{taskId}/cancel:
    post:
      summary: 取消本人尚未结束的任务；重复取消或已终态时返回实际状态
      description: 无请求体。取消后不继续修复或模板降级；执行中的JDBC Statement将被取消。完成与取消竞争时以先提交的终态为准。
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 当前任务状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TaskStatus" }
        "404": { description: 任务不存在或不属于当前用户 }
  /api/v1/query-history:
    get:
      summary: 分页读取当前用户查询历史
      parameters:
        - { name: page_no, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        "200": { description: 历史记录分页 }
  /api/v1/query-history/{historyId}:
    delete:
      summary: 删除当前用户可见历史，不删除审计日志
      parameters:
        - name: historyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: 删除成功 }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ApiResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: 处理成功 }
        data: {}
        request_id: { type: string }
    SubmitQuery:
      type: object
      required: [session_id, query_text]
      properties:
        session_id: { type: string, minLength: 1, maxLength: 36, description: 建议使用UUID }
        query_text: { type: string, minLength: 1, maxLength: 1000 }
        thinking_enabled: { type: boolean, default: true, description: 本任务固定设置，澄清和SQL修复沿用；规则路径不调用模型 }
        preferred_display:
          type: string
          description: 兼容保留字段，当前由服务端依据结果自动决定展示方式。
          example: AUTO
    TaskStatus:
      type: object
      required: [task_id, session_id, status, progress, message, clarification_round, repair_attempts, execution_timeout_seconds, cancellable, state_version, thinking_enabled]
      properties:
        task_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        status:
          type: string
          enum: [RECEIVED, INTENT_ANALYZING, ASKING, SQL_GENERATING, VALIDATING, CONFIRMING, EXECUTING, REPAIRING, FALLING_BACK, PACKAGING, SUCCESS, FAILED, CANCELLED, TIMED_OUT, DEGRADED]
        progress: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string }
        intent: { type: [string, "null"] }
        clarification_round: { type: integer, minimum: 0 }
        repair_attempts: { type: integer, minimum: 0, maximum: 2, description: 已消耗的SQL修复调用次数，不含首次规划的响应重试 }
        execution_timeout_seconds: { type: integer, minimum: 1, default: 60 }
        cancellable: { type: boolean }
        state_version: { type: integer, format: int64, minimum: 0 }
        thinking_enabled: { type: boolean }
        display_query: { type: string, description: 脱敏的当前有效问题，可能包含已选客户编号 }
        question: { $ref: "#/components/schemas/ClarificationQuestion" }
        confirmation: { $ref: "#/components/schemas/Confirmation" }
        result: { $ref: "#/components/schemas/QueryResult" }
        error:
          type: [object, "null"]
          properties:
            message: { type: string }
    ClarificationQuestion:
      type: [object, "null"]
      properties:
        question_id: { type: string, format: uuid }
        type: { type: string, enum: [MISSING_TOPIC, MISSING_TIME_RANGE, TIME_BASIS, CONFLICT, MODEL_CLARIFICATION, CUSTOMER_IDENTITY, CUSTOMER_SELECTION, CUSTOMER_NOT_FOUND, FOLLOWUP_CONTEXT] }
        prompt: { type: string }
        options: { type: array, items: { type: string } }
        recognized_slots: { type: object, additionalProperties: { type: string } }
        candidates: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/CustomerCandidate" } }
    CustomerCandidate:
      type: object
      required: [customer_id, name, branch_id, mobile]
      properties:
        customer_id: { type: string }
        name: { type: string, description: 脱敏姓名 }
        branch_id: { type: string }
        mobile: { type: string, description: 虚构脱敏手机号 }
    ConversationSummary:
      type: object
      required: [session_id, title, state_version]
      properties:
        session_id: { type: string, maxLength: 36 }
        title: { type: string, maxLength: 160 }
        active_task_id: { type: [string, "null"] }
        state_version: { type: integer, format: int64 }
        created_at: { type: string }
        updated_at: { type: string }
    ConversationContext:
      type: [object, "null"]
      properties:
        query: { type: string }
        customer_id: { type: [string, "null"] }
        source_task_id: { type: [string, "null"] }
    ConversationMessage:
      type: object
      required: [message_id, task_id, role_code, content]
      properties:
        message_id: { type: integer, format: int64 }
        task_id: { type: string }
        role_code: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        payload:
          anyOf:
            - $ref: "#/components/schemas/TaskStatus"
            - { type: "null" }
        created_at: { type: string }
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          required: [messages, has_more]
          properties:
            context: { $ref: "#/components/schemas/ConversationContext" }
            messages: { type: array, items: { $ref: "#/components/schemas/ConversationMessage" } }
            has_more: { type: boolean }
    Confirmation:
      type: [object, "null"]
      properties:
        confirm_token: { type: string }
        risk_level: { type: string, enum: [MEDIUM, HIGH] }
        message: { type: string }
        reasons: { type: array, items: { type: string } }
    QueryResult:
      type: [object, "null"]
      properties:
        result_type: { type: string, example: AUTO }
        title: { type: string }
        summary: { type: string }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ColumnMeta" }
        rows:
          type: array
          items: { type: object, additionalProperties: true }
        metrics:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              value: {}
              key: { type: string }
              unit: { type: string }
              aggregation: { type: string }
              note: { type: string, description: 指标的实际聚合口径 }
        charts:
          type: array
          items: { $ref: "#/components/schemas/ChartSpec" }
        analysis: { $ref: "#/components/schemas/AnalysisSummary" }
        sql_preview: { type: string, readOnly: true }
        data_as_of: { type: string, format: date }
        interpretation_source: { type: string, enum: [RULE, DEEPSEEK, TEMPLATE_FALLBACK, FALLBACK] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        fallback: { $ref: "#/components/schemas/FallbackInfo" }
    FallbackInfo:
      type: [object, "null"]
      properties:
        reason: { type: string }
        template_id: { type: [string, "null"] }
        data_available: { type: boolean, description: 是否成功执行了模板；true时也可能是正常空结果 }
        suggestions: { type: array, items: { type: string } }
    ColumnMeta:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        data_type: { type: string, enum: [TEXT, NUMBER, DATE] }
        sensitive: { type: boolean }
        role: { type: string, enum: [DIMENSION, TIME, MEASURE] }
        unit: { type: string }
        aggregation: { type: string, enum: [SUM, AVERAGE, WEIGHTED_AVERAGE, NONE] }
        weight_key: { type: [string, "null"] }
    ChartSpec:
      type: object
      properties:
        type: { type: string, enum: [BAR, LINE, AREA, PIE, SCATTER, HEATMAP] }
        title: { type: string }
        dimension_key: { type: string }
        dimension_label: { type: string }
        secondary_dimension_key: { type: [string, "null"], description: 热力图第二维度或时间折线的分类系列键 }
        reason: { type: string }
        series:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              unit: { type: string }
    AnalysisSummary:
      type: object
      properties:
        overview: { type: string }
        insights: { type: array, items: { type: string } }
        suggestions: { type: array, items: { type: string } }
security:
  - bearerAuth: []
