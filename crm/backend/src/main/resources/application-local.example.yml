spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/pf_nl2sql?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Hong_Kong&useSSL=false
    username: nl2sql_app
    password: 请填写本地数据库密码

app:
  security:
    jwt-secret: 请替换为至少32字节的随机字符串
  model:
    provider: mock
    deepseek:
      # 演示自由提问时将provider改为deepseek并填写密钥；固定高频问题仍优先走规则。
      base-url: https://api.deepseek.com
      api-key: "请填写DeepSeek API密钥"
      model: deepseek-v4-flash
      thinking-enabled: true
      tools-enabled: true
      max-tool-rounds: 3
      max-tokens: 16384
      retry-max-tokens: 32768
      read-timeout-seconds: 120
    qwen:
      base-url: ""
      api-key: ""
      model: Qwen3-32B
  rag:
    enabled: false
    embedding-model: BCG-E3
    embedding-base-url: ""
    milvus-uri: ""
    collection: nl2sql_business_knowledge
