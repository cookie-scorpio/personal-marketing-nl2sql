server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: nl2sql-crm-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/pf_nl2sql?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Hong_Kong&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:nl2sql_app}
    password: ${MYSQL_PASSWORD:nl2sql_dev_password}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 同一事务加锁后必须重新读取任务，不能复用加锁前的空结果或旧状态。
    local-cache-scope: statement
  global-config:
    banner: false

app:
  security:
    # 仅用于本地 MVP。部署到其他环境时必须通过环境变量覆盖。
    jwt-secret: ${JWT_SECRET:nl2sql-local-development-secret-change-before-sharing}
    jwt-ttl-seconds: ${JWT_TTL_SECONDS:28800}
  model:
    provider: ${MODEL_PROVIDER:mock}
    request-budget-file: ${MODEL_REQUEST_BUDGET_FILE:}
    request-budget: ${MODEL_REQUEST_BUDGET:50}
    deepseek:
      tools-enabled: ${DEEPSEEK_TOOLS_ENABLED:true}
      max-tool-rounds: ${DEEPSEEK_MAX_TOOL_ROUNDS:3}
      # DeepSeek支持OpenAI兼容的/chat/completions接口；演示时只需填写API密钥即可。
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      # 适配器缺省设置；对话API省略thinking_enabled时按true接收，可按任务覆盖。
      thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:true}
      max-tokens: ${DEEPSEEK_MAX_TOKENS:16384}
      # 仅空回复或截断时重试一次，避免无界增加调用量。
      retry-max-tokens: ${DEEPSEEK_RETRY_MAX_TOKENS:32768}
      read-timeout-seconds: ${DEEPSEEK_READ_TIMEOUT_SECONDS:120}
    qwen:
      base-url: ${QWEN_BASE_URL:}
      api-key: ${QWEN_API_KEY:}
      model: ${QWEN_MODEL:Qwen3-32B}
  query:
    sql-log-dir: ${SQL_REVIEW_LOG_DIR:logs}
    execution-timeout-seconds: ${QUERY_EXECUTION_TIMEOUT_SECONDS:60}
    max-result-rows: ${QUERY_MAX_RESULT_ROWS:100}
    max-clarification-rounds: ${QUERY_MAX_CLARIFICATION_ROUNDS:5}
  rag:
    # V1.0只保留外置RAG配置，不创建Milvus连接，也不调用Embedding服务。
    enabled: ${RAG_ENABLED:false}
    embedding-model: ${EMBEDDING_MODEL:BCG-E3}
    embedding-base-url: ${EMBEDDING_BASE_URL:}
    milvus-uri: ${MILVUS_URI:}
    collection: ${MILVUS_COLLECTION:nl2sql_business_knowledge}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
