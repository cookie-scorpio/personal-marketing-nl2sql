server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: nl2sql-crm-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/pf_nl2sql?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Hong_Kong&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:jfc123456}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:jfc123456}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  quality:
    spool-dir: ${QUALITY_SPOOL_DIR:./logs/quality-spool}
    spool-retry-interval-ms: ${QUALITY_SPOOL_RETRY_INTERVAL_MS:30000}
  security:
    # 必须通过环境变量 JWT_SECRET 提供；缺失时应用拒绝启动，不再提供可猜测的默认值。
    jwt-secret: ${JWT_SECRET:jdjahsbdasbdiuidjsknfjksdnfjndskjfnjkdsnfkjdsnfkjdsnfkjdsnfk}
    jwt-ttl-seconds: ${JWT_TTL_SECONDS:28800}
    # 设置 AUTH_RSA_PRIVATE_KEY 时使用该 PKCS#8 PEM 私钥；未设置时，本地开发会生成进程内临时密钥。
    password-rsa-private-key: ${AUTH_RSA_PRIVATE_KEY:}
    # 生产或共享环境应设为 false，并要求通过 AUTH_RSA_PRIVATE_KEY 提供固定私钥。
    allow-ephemeral-password-rsa-key: ${AUTH_ALLOW_EPHEMERAL_RSA_KEY:true}
  model:
    # 当前默认使用Qwen3-32B；如需切回DeepSeek，设置环境变量 MODEL_PROVIDER=deepseek 即可。
    provider: ${MODEL_PROVIDER:qwen}
    deepseek:
      tools-enabled: ${DEEPSEEK_TOOLS_ENABLED:true}
      max-tool-rounds: ${DEEPSEEK_MAX_TOOL_ROUNDS:3}
      # 成功执行后只发送列名、类型和行数等摘要复核结果结构，不发送业务数据值。
      result-review-enabled: ${DEEPSEEK_RESULT_REVIEW_ENABLED:true}
      # DeepSeek支持OpenAI兼容的/chat/completions接口；地址与密钥通过环境变量或application-local.yml提供。
      base-url: ${DEEPSEEK_BASE_URL:}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      # V4默认开启思考；短JSON规划显式关闭，防止思考耗尽输出额度而无最终content。
      thinking-enabled: ${DEEPSEEK_THINKING_ENABLED:true}
      max-tokens: ${DEEPSEEK_MAX_TOKENS:4096}
      # 仅空回复或截断时重试一次，避免无界增加调用量。
      retry-max-tokens: ${DEEPSEEK_RETRY_MAX_TOKENS:8192}
      read-timeout-seconds: ${DEEPSEEK_READ_TIMEOUT_SECONDS:60}
    qwen:
      # 当前使用阿里云DashScope的OpenAI兼容模式。
      # 如换成自建服务：vLLM用http://127.0.0.1:8000/v1，Ollama用http://127.0.0.1:11434/v1，
      # 并把thinking-param改为chat_template_kwargs（vLLM）或think（Ollama），自建服务密钥可留空。
      base-url: ${QWEN_BASE_URL:}
      # DashScope必须在阿里云百炼控制台申请API Key（sk-开头）；地址与密钥填在application-local.yml或环境变量QWEN_API_KEY。
      api-key: ${QWEN_API_KEY:}
      model: ${QWEN_MODEL:qwen3-32b}
      # Qwen3为混合思考模型；短JSON规划建议关闭思考，防止思考耗尽输出额度而无最终content。
      thinking-enabled: ${QWEN_THINKING_ENABLED:false}
      # 思考开关的协议参数随部署方式不同：vLLM/SGLang用chat_template_kwargs，
      # DashScope兼容模式用enable_thinking，Ollama用think，none表示不发送任何思考参数。
      thinking-param: ${QWEN_THINKING_PARAM:enable_thinking}
      tools-enabled: ${QWEN_TOOLS_ENABLED:true}
      max-tool-rounds: ${QWEN_MAX_TOOL_ROUNDS:3}
      # 成功执行后只发送列名、类型和行数等摘要复核结果结构，不发送业务数据值。
      result-review-enabled: ${QWEN_RESULT_REVIEW_ENABLED:true}
      max-tokens: ${QWEN_MAX_TOKENS:16384}
      # 仅空回复或截断时重试一次，避免无界增加调用量。
      retry-max-tokens: ${QWEN_RETRY_MAX_TOKENS:32768}
      read-timeout-seconds: ${QWEN_READ_TIMEOUT_SECONDS:120}
  query:
    sql-log-dir: ${SQL_REVIEW_LOG_DIR:./logs}
    execution-timeout-seconds: ${QUERY_EXECUTION_TIMEOUT_SECONDS:60}
    # QUERY_MAX_RESULT_ROWS保留为旧部署兼容别名；它现在只决定默认单页大小，不再静默截断总结果。
    default-page-size: ${QUERY_DEFAULT_PAGE_SIZE:${QUERY_MAX_RESULT_ROWS:100}}
    max-page-size: ${QUERY_MAX_PAGE_SIZE:500}
    max-offset: ${QUERY_MAX_OFFSET:100000}
    max-sql-limit: ${QUERY_MAX_SQL_LIMIT:500}
    max-clarification-rounds: ${QUERY_MAX_CLARIFICATION_ROUNDS:2}
  rag:
    # V1.0只保留外置RAG配置，不创建Milvus连接，也不调用Embedding服务。
    enabled: ${RAG_ENABLED:false}
    embedding-model: ${EMBEDDING_MODEL:BCG-E3}
    embedding-base-url: ${EMBEDDING_BASE_URL:}
    milvus-uri: ${MILVUS_URI:}
    collection: ${MILVUS_COLLECTION:nl2sql_business_knowledge}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
